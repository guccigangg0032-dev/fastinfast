<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Preview Asia — демонстрационная площадка цифровых проектов.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Preview Asia · Демонстрационная площадка</title>
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color-scheme:dark;--fg:#f5f5f7;--muted:#a5a7b1}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 52% 40%,#172139 0%,#0c1020 28%,#080b12 67%);color:var(--fg);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
    header{display:flex;align-items:center;justify-content:space-between;padding:clamp(22px,4vw,46px) clamp(20px,6vw,85px)}
    .brand{display:flex;align-items:center;gap:13px;font-size:17px;font-weight:720;letter-spacing:.025em}
    .brand-mark{display:grid;place-items:center;width:39px;height:39px;background:#f2f3f7;color:#080b12;border-radius:11px;font-size:21px;font-weight:850}
    .header-note{font-size:12px;color:#9da1af;letter-spacing:.14em;text-transform:uppercase}
    main{flex:1;display:grid;place-items:center;text-align:center;padding:70px 22px 100px}
    .content{max-width:650px}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;color:#b6bac8;font-size:12px;text-transform:uppercase;letter-spacing:.17em;font-weight:650;margin-bottom:20px}
    .dot{width:7px;height:7px;border-radius:50%;background:#7fa5fb;box-shadow:0 0 18px #7fa5fb}
    h1{font-size:clamp(36px,6.8vw,72px);line-height:1.1;letter-spacing:-.052em;font-weight:670;margin:0 0 25px}
    p{font-size:clamp(15px,2.5vw,18px);line-height:1.75;color:var(--muted);max-width:550px;margin:0 auto}
    footer{padding:23px clamp(20px,6vw,85px);border-top:1px solid #ffffff12;display:flex;justify-content:space-between;gap:20px;color:#808694;font-size:12px}
    @media(max-width:560px){.header-note{display:none}footer{flex-direction:column;gap:5px;text-align:center}main{padding-bottom:55px}}
  </style>
</head>
<body>
  <header><div class="brand"><span class="brand-mark" aria-hidden="true">P</span><span>PREVIEW<span style="color:#8189a0">.ASIA</span></span></div><span class="header-note">Digital showcase</span></header>
  <main><div class="content"><div class="eyebrow"><span class="dot"></span>Демонстрационная площадка</div><h1>Идеи, которые<br>можно увидеть.</h1><p>Пространство для презентаций и тестирования цифровых проектов. Демонстрации открываются по отдельным ссылкам.</p></div></main>
  <footer><span>© 2026 Preview Asia</span><span>Независимая демонстрационная площадка</span></footer>
</body>
</html>
